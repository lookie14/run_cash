<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#1E6B45">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="Run Cash">
  <title>Run Cash 관리자</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header class="top">
    <h1>Run Cash 관리자</h1>
    <span class="badge">보기 전용</span>
  </header>

  <main id="app">
    <p class="muted" id="loading">불러오는 중...</p>

    <!-- 처음 접속: 관리자 초대 숫자로 참여 -->
    <section id="join" class="card hidden">
      <h2>관리자로 참여하기</h2>
      <p class="muted">앱의 관리자 화면 → <b>관리자 추가</b>를 누르면 나오는 숫자 6개를 넣어 주세요.</p>
      <label>내 이름 <input id="join-name" maxlength="12" placeholder="예: 엄마"></label>
      <label>초대 숫자 <input id="join-code" inputmode="numeric" maxlength="6" placeholder="6자리"></label>
      <button id="join-btn" class="primary">참여하기</button>
      <p id="join-msg" class="error"></p>
    </section>

    <!-- 대시보드 -->
    <div id="dash" class="hidden">
      <section id="status" class="card"></section>
      <section id="settlement" class="card hidden"></section>
      <section id="month" class="card passbook"></section>
      <section id="week" class="card"></section>
      <section id="trend" class="card"></section>
      <section id="rules" class="card"></section>
      <section id="calendar" class="card"></section>
      <section id="admins" class="card"></section>
      <p class="muted small">목표 변경, 정산("보냈어요"), 관리자 추가는 안드로이드 앱의 관리자 화면에서 할 수 있어요.</p>
    </div>

    <p id="error" class="error"></p>
  </main>

  <script type="module" src="app.js"></script>
</body>
</html>
